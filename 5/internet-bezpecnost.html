<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bezpečnost na internetu – cvičení (5. třída)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      body {
        background: radial-gradient(1200px 600px at 20% 0%, #e8f4ff 0%, rgba(232, 244, 255, 0) 60%),
          radial-gradient(900px 500px at 90% 20%, #fff3e6 0%, rgba(255, 243, 230, 0) 55%),
          linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
      }
      .hero {
        border: 1px solid rgba(13, 110, 253, 0.15);
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(6px);
      }
    </style>
  </head>
  <body>
    <main class="container py-4 py-md-5">
      <div class="hero rounded-4 p-4 p-md-5 shadow-sm mb-4">
        <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
          <a class="btn btn-outline-secondary" href="../home.html" aria-label="Zpět na domovskou stránku">
            <span class="d-inline-flex align-items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 1-.5.5H3.707l3.147 3.146a.5.5 0 0 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L3.707 7.5H14.5A.5.5 0 0 1 15 8z"/>
              </svg>
              <span>Zpět</span>
            </span>
          </a>
          <span class="badge text-bg-success px-3 py-2">5. třída</span>
        </div>

        <h1 class="display-6 fw-bold mb-2">Bezpečnost na internetu</h1>
        <p class="lead mb-0">Vyber bezpečnou možnost.</p>
      </div>

      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4 p-md-4">
          <div class="vstack gap-4">
            <div>
              <div class="fw-semibold mb-2">1) Co uděláš, když ti přijde podezřelá zpráva s odkazem?</div>
              <select class="form-select" id="q1">
                <option value="">Vyber…</option>
                <option value="a">Kliknu hned, ať to mám z krku</option>
                <option value="b">Neotevřu to a řeknu to dospělému</option>
                <option value="c">Pošlu to dál kamarádům</option>
              </select>
            </div>

            <div>
              <div class="fw-semibold mb-2">2) Jaké heslo je nejlepší?</div>
              <select class="form-select" id="q2">
                <option value="">Vyber…</option>
                <option value="a">123456</option>
                <option value="b">pejsek</option>
                <option value="c">Dlouhé a různorodé (písmena+čísla)</option>
              </select>
            </div>

            <div>
              <div class="fw-semibold mb-2">3) Co je OK sdílet veřejně?</div>
              <select class="form-select" id="q3">
                <option value="">Vyber…</option>
                <option value="a">Adresu bydliště</option>
                <option value="b">Telefonní číslo</option>
                <option value="c">Oblíbený film / koníček</option>
              </select>
            </div>
          </div>

          <hr class="my-4" />

          <div class="d-grid d-sm-flex gap-2 align-items-sm-center">
            <button class="btn btn-primary btn-lg" type="button" onclick="check()">Zkontrolovat</button>
            <div id="result" class="fw-semibold"></div>
          </div>
        </div>
      </div>
    </main>

    <script>
      function check() {
        const ok =
          document.getElementById('q1').value === 'b' &&
          document.getElementById('q2').value === 'c' &&
          document.getElementById('q3').value === 'c';

        const el = document.getElementById('result');
        el.className = 'fw-semibold ' + (ok ? 'text-success' : 'text-danger');
        el.textContent = ok ? '✔ Skvělé, bezpečně!' : '✘ Ještě jednou';
      }
    </script>
  </body>
</html>
